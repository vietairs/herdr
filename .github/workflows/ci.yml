name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, windows]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  # Keep file/line backtraces without generating type and variable debug information.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # Persist both Zig caches; build outputs otherwise stay uncached in Cargo's OUT_DIR.
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  # PR caches are visible only to their own PR, and every save pushes the
  # repository toward GitHub's cache limit, evicting the master caches PRs
  # restore from. Only branch pushes save.
  SAVE_CACHES: ${{ github.event_name == 'push' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commits:
    # Same-repo runs use the self-hosted runner; PRs from outside forks fall back to GitHub-hosted (same check name).
    if: github.event_name != 'push' || github.ref_name == 'master'
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate commit subjects
        env:
          CI_BEFORE: ${{ github.event.before }}
          CI_AFTER: ${{ github.event.after }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/ci/conventional-commits.sh

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: unix
            nextest_filter: all()
          - os: macos-latest
            kind: unix
            nextest_filter: not binary(live_handoff)
          - os: windows-latest
            kind: windows
    # Same-repo runs use the self-hosted runner; PRs from outside forks fall back to GitHub-hosted (same check name); matrix values and check names stay as-is.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && matrix.os || fromJSON('{"ubuntu-latest":["self-hosted","Linux","X64"],"macos-latest":["self-hosted","macOS","ARM64"],"windows-latest":["self-hosted","Windows","X64"]}')[matrix.os] }}
    # The self-hosted Linux runner builds amd64 under emulation; hosted runners finished well inside 15m.
    timeout-minutes: 60
    steps:
      # The macOS runner is the maintainer's own Mac: keep every HOME-relative write
      # (rustup, cargo, bun, git config) inside this job's temp dir.
      - name: Isolate HOME on the self-hosted macOS runner
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      # The hosted Windows image ships Python and Node; the self-hosted Windows VM has neither.
      # `just check` -> `just test` runs python unittest (tomllib needs 3.11+) and bun tests that spawn node.
      - name: Install Python
        if: runner.os == 'Windows'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install Node
        if: runner.os == 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          check-latest: true

      - name: Install Rust
        if: matrix.kind == 'unix'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy

      - name: Install Rust
        if: matrix.kind == 'windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc

      - name: Install Rust tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Zig downloads come from ziglang.org or a random community mirror and
      # vary from seconds to minutes; reuse the verified install instead.
      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      # Zig's C-header cache keys include the compiler installation path.
      - name: Stabilize Zig installation path on Unix
        if: matrix.kind == 'unix'
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
          if [ "$ZIG_RESTORED" != "true" ]; then
            # Copy, never move: a self-hosted runner's tool cache outlives the job.
            cp -R "$(dirname "$(command -v zig)")" "$stable_zig"
          fi
          echo "$stable_zig" >> "$GITHUB_PATH"
          echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

      - name: Stabilize Zig installation path on Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          $stable = Join-Path $env:RUNNER_TEMP "herdr-zig-0.16.0"
          if ($env:ZIG_RESTORED -ne "true") {
            $source = Split-Path (Get-Command zig).Source
            # Copy, never move: a self-hosted runner's tool cache outlives the job.
            Copy-Item -LiteralPath $source -Destination $stable -Recurse
          }
          $stable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ZIG=$(Join-Path $stable 'zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save Zig compiler
        if: steps.zig-compiler.outputs.cache-hit != 'true' && env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Restore Zig build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: ${{ matrix.os }}
          save-if: ${{ env.SAVE_CACHES }}

      # Cargo still rebuilds workspace targets; only rustc's validated query state is retained.
      - name: Restore incremental compiler state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: ci-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-${{ github.sha }}
          restore-keys: |
            ci-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-

      - name: Run checks
        shell: bash
        env:
          NEXTEST_FILTER: ${{ matrix.nextest_filter }}
        run: bash scripts/ci/check.sh

      # Save before rust-cache's post-step removes incremental state.
      - name: Save incremental compiler state
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/debug/incremental
          key: ci-incremental-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/config.toml', 'build.rs', 'crates/*/Cargo.toml', 'crates/*/build.rs') }}-${{ github.sha }}

      - name: Save Zig build cache
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}

  windows-conpty-package:
    name: Windows ConPTY package
    # Always GitHub-hosted: the test rewrites the real HKCU PATH, which the shared self-hosted Windows VM cannot isolate.
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Stabilize Zig installation path
        shell: pwsh
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          $stable = Join-Path $env:RUNNER_TEMP "herdr-zig-0.16.0"
          if ($env:ZIG_RESTORED -ne "true") {
            $source = Split-Path (Get-Command zig).Source
            # Copy, never move: a self-hosted runner's tool cache outlives the job.
            Copy-Item -LiteralPath $source -Destination $stable -Recurse
          }
          $stable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ZIG=$(Join-Path $stable 'zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Zig build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-conpty-package-windows-2022-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-build-v1-conpty-package-windows-2022-${{ runner.arch }}-0.16.0-

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: conpty-package-windows-2022
          save-if: ${{ env.SAVE_CACHES }}

      - name: Build Herdr
        shell: bash
        run: bash scripts/ci/windows-conpty-package.sh build

      - name: Save Zig build cache
        if: env.SAVE_CACHES == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-build-v1-conpty-package-windows-2022-${{ runner.arch }}-0.16.0-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify, package and probe the ConPTY bundle
        shell: bash
        run: bash scripts/ci/windows-conpty-package.sh verify
