name: Distribution contract

on:
  pull_request:
    paths:
      - ".github/workflows/distribution.yml"
      - "distribution/**"
      - "docs/next/website/**"
      - "docs/preview/**"
      - "docs/versions/**"
      - "scripts/agent_detection_manifest_check.py"
      - "scripts/config_reference_check.py"
      - "scripts/docs/**"
      - "scripts/docs_translation_parity.py"
      - "scripts/preview.py"
      - "scripts/test_agent_detection_manifest_check.py"
      - "scripts/test_config_reference_check.py"
      - "scripts/test_docs_translation_parity.py"
      - "scripts/test_preview.py"
      - "src/detect/manifest_update.rs"
      - "src/detect/manifests/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/distribution.yml"
      - "distribution/**"
      - "docs/next/website/**"
      - "docs/preview/**"
      - "docs/versions/**"
      - "scripts/agent_detection_manifest_check.py"
      - "scripts/config_reference_check.py"
      - "scripts/docs/**"
      - "scripts/docs_translation_parity.py"
      - "scripts/preview.py"
      - "scripts/test_agent_detection_manifest_check.py"
      - "scripts/test_config_reference_check.py"
      - "scripts/test_docs_translation_parity.py"
      - "scripts/test_preview.py"
      - "src/detect/manifest_update.rs"
      - "src/detect/manifests/**"

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Self-hosted runner: never run code from pull requests opened by outside forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hosted ubuntu images ship Node; the self-hosted Linux runner does not.
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate distribution contract
        run: bash scripts/ci/validate.sh
