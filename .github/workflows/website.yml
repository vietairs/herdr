name: Website

on:
  pull_request:
    paths:
      - ".github/workflows/website.yml"
      - "website/**"
      - "docs/next/website/**"
      - "docs/preview/**"
      - "docs/versions/**"
      - "scripts/test_preview.py"
  push:
    branches: [master]
    paths:
      - ".github/workflows/website.yml"
      - "website/**"
      - "docs/next/website/**"
      - "docs/preview/**"
      - "docs/versions/**"
      - "scripts/test_preview.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Same-repo runs use the self-hosted runner; PRs from outside forks fall back to GitHub-hosted (same check name).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hosted ubuntu images ship Node; the self-hosted Linux runner does not.
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          # The self-hosted tool cache keeps the first 22.x it downloads; keep tracking the latest 22.x.
          check-latest: true

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate and build the website
        run: bash scripts/ci/build.sh
