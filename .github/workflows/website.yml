name: Website

# CI deliberately skips website/**, and until this workflow existed nothing
# built the site outside release.yml. A merge could therefore break the docs
# build and stay green until a release tag failed at validate-release-inputs,
# which is exactly how the v0.8.0 merge shipped archived docs to the wrong
# route. This runs the same steps release.yml does, at merge time instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website.yml"
  push:
    branches: [master]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Same command release.yml runs. build:draft ends in check-built-docs.mjs,
      # which is the assertion that every archived version actually built at
      # /docs/<version>/ rather than merely compiling.
      - name: Build and check docs
        run: cd website && bun install --frozen-lockfile && bun run test && bun run build:draft
